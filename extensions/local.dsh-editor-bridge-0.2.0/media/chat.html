<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data: https:; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>DSH Chat</title>
</head>
<body>
  <div class="app">
    <header class="bar">
      <select id="model" class="model" title="选择模型（来自 DSH 的配置）"></select>
      <button id="refresh" class="icon-btn" title="刷新模型列表">⟳</button>
      <button id="new" class="icon-btn" title="新对话">＋</button>
    </header>

    <div id="error" class="error" hidden></div>

    <main id="log" class="log">
      <div id="empty" class="empty">
        <p class="empty-title">DSH Chat</p>
        <p class="empty-hint">直接用你在 DSH 里配置的模型提问。<br />
          勾选下方「带上下文」会把当前文件与选区一并发给模型。</p>
        <p class="empty-hint dim">需要真正改文件时，点回复下方的「→ Agents」交回 DSH。</p>
      </div>
    </main>

    <footer class="composer">
      <div class="composer-top">
        <button id="ctx" class="chip" type="button" aria-pressed="true">
          <span class="dot"></span><span class="chip-label">带上下文</span>
        </button>
        <span id="ctxinfo" class="ctxinfo"></span>
      </div>
      <textarea id="input" rows="3" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="composer-bottom">
        <span id="hint" class="hint"></span>
        <button id="stop" class="btn secondary" hidden>停止</button>
        <button id="send" class="btn primary">发送</button>
      </div>
    </footer>
  </div>
  <script nonce="{{nonce}}" src="{{markdownUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
