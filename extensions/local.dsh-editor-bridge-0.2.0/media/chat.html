<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data: https:; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>DSH Chat</title>
</head>
<body>
  <div class="app">
    <header class="bar">
      <select id="session" class="session" title="当前会话（与 DSH Agents 同一个）"></select>
      <button id="rename" class="icon-btn" title="重命名当前会话">✎</button>
      <button id="new" class="icon-btn" title="新建会话">＋</button>
    </header>

    <div id="error" class="error" hidden></div>

    <main id="log" class="log">
      <div id="empty" class="empty">
        <p class="empty-title">DSH Chat</p>
        <p class="empty-hint">这是 DSH 真实 Agent 会话，<b>能改文件、能跑命令</b>。<br />
          在编辑器里问过的问题，切到 DSH Agents 模式能看到同一条会话。</p>
        <p class="empty-hint dim">历史面板里可以按工作区翻旧会话。</p>
      </div>
    </main>

    <footer class="composer">
      <div class="composer-top">
        <span id="ctxinfo" class="ctxinfo"></span>
      </div>
      <textarea id="input" rows="3" placeholder="让 DSH 改点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="composer-bottom">
        <span id="hint" class="hint"></span>
        <button id="stop" class="btn secondary" hidden>停止</button>
        <button id="send" class="btn primary">发送</button>
      </div>
    </footer>
  </div>
  <script nonce="{{nonce}}" src="{{markdownUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
